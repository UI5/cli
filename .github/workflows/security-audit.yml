name: Security Audit

on:
  schedule:
    - cron: "36 4 * * *" # Run once a day
  workflow_dispatch:

# No permissions are required for this workflow
permissions: {}

jobs:
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Continue all jobs even if one fails
      matrix:
        branch: ["main", "v4"] # List of branches to run the security audit on

    steps:
      - name: Checkout '${{ matrix.branch }}' branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}

      # Use Node.js 24 to get npm 11 instead of npm 10. The default runner Node.js version is 22, which
      # comes with npm 10. This could lead to different installation paths that could conflict with the
      # allowlist in audit-ci.jsonc.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Use audit-ci
        run: npm run audit

  security-scan-latest:
    name: "Security Audit · latest (${{ matrix.scope }}) · ${{ matrix.branch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Continue all jobs even if one fails
      matrix:
        branch: ["main", "v4"] # List of branches to run the security audit on
        scope: ["dev + prod", "prod only"]
        include:
          # "dev + prod": everything the repository pulls in, resolved to latest
          - scope: "dev + prod"
            audit_flags: ""
          # "prod only": exactly what consumers install, resolved to latest
          - scope: "prod only"
            audit_flags: "-- --skip-dev"

    steps:
      - name: Checkout '${{ matrix.branch }}' branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}

      # Use Node.js 24 to get npm 11 instead of npm 10. The default runner Node.js version is 22, which
      # comes with npm 10. This could lead to different installation paths that could conflict with the
      # allowlist in audit-ci.jsonc.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Drop the lockfile so npm re-resolves every range to the latest satisfying version.
      # Unlike the pinned "npm ci" audit above, this reflects what actually lands in a fresh
      # installation today (we publish without a lockfile), so we can react to new advisories
      # before Dependabot bumps the committed package-lock.json.
      #
      # We install the full tree (including devDependencies) on purpose: audit-ci is itself a
      # devDependency, so "--omit=dev" would remove the audit tool. The audit scope is instead
      # controlled by the "--skip-dev" flag below, which filters the dependency graph npm audit
      # reads from the lockfile — it does not require devDependencies to be absent from disk.
      - name: Resolve latest dependencies (ignore lockfile)
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      # For the "prod only" scope, "--skip-dev" makes audit-ci pass "--omit=dev" to npm audit so
      # only the production dependencies consumers receive are audited.
      - name: Use audit-ci
        run: npm run audit ${{ matrix.audit_flags }}
