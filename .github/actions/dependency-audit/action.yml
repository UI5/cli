name: "Dependency security audit (one target)"
description: >
  Audit a single target id (a repository or an npm package from targets.json), upload its results as
  an artifact, and fail THIS job on findings. Used once per matrix job; the caller's summary job
  merges all artifacts into one job summary.

inputs:
  id:
    description: "Target id from targets.json (e.g. repo-cli-v4, npm-cli-v5)."
    required: true
  node-version:
    description: "Node.js version to set up (npm 11+ recommended for stable audit paths)."
    default: "24"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    # Produce results only — the audit script never fails. Repos are cloned by the driver, so no
    # extra checkout of the audited project is needed (and no dependency code runs: --ignore-scripts).
    - name: Audit ${{ inputs.id }}
      shell: bash
      run: >
        node "${{ github.action_path }}/scripts/audit-all.mjs"
        --targets "${{ github.action_path }}/targets.json"
        --results "${{ runner.temp }}/audit-results"
        --only "${{ inputs.id }}"

    # Upload BEFORE gating (and always), so the summary job can render even when this job fails.
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4 # TODO: pin to a commit SHA
      with:
        name: audit-${{ inputs.id }}
        path: ${{ runner.temp }}/audit-results
        if-no-files-found: warn

    - name: Fail on findings
      shell: bash
      run: node "${{ github.action_path }}/scripts/gate.mjs" --results "${{ runner.temp }}/audit-results"
