version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  commit-message:
    prefix: "ci(github-actions)"
  cooldown:
    default-days: 3
  groups:
    github-actions:
      applies-to: version-updates
      patterns:
      - "*"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: sunday
    time: "10:00"
    timezone: Etc/UCT
  cooldown:
    default-days: 3
    exclude:
    - "@ui5/*"
    - "less-openui5"
  versioning-strategy: increase
  commit-message:
    prefix: "deps"
    prefix-development: "build(deps-dev)"
  groups:
    npm:
      dependency-type: production
      update-types:
      - minor
      - patch
    npm-dev:
      dependency-type: development
      update-types:
      - minor
      - patch
